[package]
name = "campus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
[[bin]]
name = "campus"
path = "src/main.rs"
[features]
default = ["keyring", "media"]
keyring = ["campus-db/keyring"]
media = ["campus-net/media"]
sqlcipher = ["campus-db/sqlcipher"]
developer = []
[dependencies]
campus-core.workspace = true
campus-db = { workspace = true, default-features = false }
campus-net = { workspace = true, default-features = false }
campus-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
jiff.workspace = true
clap = { version = "4", features = ["derive", "env"] }
unicode-width = "0.2"
terminal_size = "0.4"
anstyle = "1"
rpassword = "7"
crossterm = { version = "0.29", default-features = false, features = ["events"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
zeroize.workspace = true
url.workspace = true
[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
[build-dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
