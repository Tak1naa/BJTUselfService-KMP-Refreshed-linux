[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
campus-core = { path = "crates/campus-core" }
campus-db = { path = "crates/campus-db", default-features = false }
campus-net = { path = "crates/campus-net", default-features = false }
campus-sync = { path = "crates/campus-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jiff = "0.2"
url = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "stream", "multipart", "json"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
